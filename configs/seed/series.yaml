# Every series of the Multi-Asset Allocation Framework v2 workbook.
#
# Source of truth: the workbook's Calculation Guide and Weights & Rules sheets.
# The four Data Trackers logs (valuation, rates, metals, flows) are imported by
# configs/seed/import_mappings/*_log.yaml; the "new columns" of the upload
# template come in through extras_log.yaml. Everything the workbook computes
# (spreads, ratios, returns, percentiles and all 85 scores) is derived here
# point-in-time: a value at month d only reads observations dated <= d.
#
# Each derivation cites the guide row it implements. When a methodology change
# is agreed, edit the derivation here and bump its `version` (a rebuild keeps
# the old rows).
#
# Conventions
#   percentiles  pctile.<window>m.<series>, Excel PERCENTRANK.INC x 100, null
#                below the governance minimum (24 observations). 15Y windows
#                unless the guide says otherwise (gold: 20Y).
#   scores       <node>::<signal> (CORE keys), 0-100, higher = more attractive.
#                "Inverted" = 100 - percentile (valuation, flows); yields,
#                spreads, breadth and momentum are scored as-is.
#   constants    tick on the 10Y G-sec log so they exist every month.
#   missing      a score with a missing input is null; model.run scores it 50
#                with a warning (Calculation Guide practical note 3).

# ----------------------------------------------------------------------------
# Raw: Data Trackers — equity valuation log
# niftyindices.com; import_mappings/valuation_log.yaml
# ----------------------------------------------------------------------------
- {key: pe.nifty100, name: "Nifty 100 P/E", entity: idx.nifty100, layer: raw, value_type: num, unit: x, frequency: monthly, validation: {min: 0, max: 200}}
- {key: pe.midcap150, name: "Nifty Midcap 150 P/E", entity: idx.midcap150, layer: raw, value_type: num, unit: x, frequency: monthly, validation: {min: 0, max: 200}}
- {key: pe.smallcap250, name: "Nifty Smallcap 250 P/E", entity: idx.smallcap250, layer: raw, value_type: num, unit: x, frequency: monthly, validation: {min: 0, max: 200}}

# ----------------------------------------------------------------------------
# Raw: Data Trackers — rates & credit log
# RBI/CCIL, FIMMDA; import_mappings/rates_log.yaml
# ----------------------------------------------------------------------------
- {key: yield.gsec10y, name: "10Y G-sec yield", layer: raw, value_type: num, unit: "%", frequency: monthly, validation: {min: -5, max: 30}}
- {key: rate.repo, name: "Repo rate", layer: raw, value_type: num, unit: "%", frequency: monthly, validation: {min: -5, max: 30}}
- {key: yield.aaa3y, name: "3Y AAA corporate yield", layer: raw, value_type: num, unit: "%", frequency: monthly, validation: {min: -5, max: 30}}

# ----------------------------------------------------------------------------
# Raw: Data Trackers — precious metals log
# Bullion; import_mappings/metals_log.yaml
# ----------------------------------------------------------------------------
- {key: gold.inr10g, name: "Gold price", entity: metals.gold, layer: raw, value_type: num, unit: INR/10g, frequency: monthly, validation: {min: 0}}
- {key: silver.inrkg, name: "Silver price", entity: metals.silver, layer: raw, value_type: num, unit: INR/kg, frequency: monthly, validation: {min: 0}}

# ----------------------------------------------------------------------------
# Raw: Data Trackers — category flow log
# AMFI monthly net flows, INR crore; import_mappings/flows_log.yaml
# ----------------------------------------------------------------------------
- {key: flows.large, name: "Large Cap net flows", entity: equity.large, layer: raw, value_type: num, unit: "INR cr", frequency: monthly}
- {key: flows.mid, name: "Mid Cap net flows", entity: equity.mid, layer: raw, value_type: num, unit: "INR cr", frequency: monthly}
- {key: flows.small, name: "Small Cap net flows", entity: equity.small, layer: raw, value_type: num, unit: "INR cr", frequency: monthly}
- {key: flows.sectoral, name: "Sectoral/Thematic net flows", layer: raw, value_type: num, unit: "INR cr", frequency: monthly}
- {key: flows.gold_etf, name: "Gold ETF net flows", entity: metals.gold, layer: raw, value_type: num, unit: "INR cr", frequency: monthly}

