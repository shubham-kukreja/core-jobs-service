# ----------------------------------------------------------------------------
# Derived: same-date arithmetic
# ----------------------------------------------------------------------------
- {key: spread.mid_large, name: "Mid–Large P/E spread", entity: equity.mid, layer: derived, value_type: num, unit: x, frequency: monthly,
   derivation: {fn: expr, inputs: {mid: pe.midcap150, large: pe.nifty100}, params: {expr: "mid - large"}, version: 1}}
- {key: spread.small_large, name: "Small–Large P/E spread", entity: equity.small, layer: derived, value_type: num, unit: x, frequency: monthly,
   derivation: {fn: expr, inputs: {small: pe.smallcap250, large: pe.nifty100}, params: {expr: "small - large"}, version: 1}}
- {key: spread.aaa_bps, name: "AAA spread", entity: debt.corporate, layer: derived, value_type: num, unit: bps, frequency: monthly,
   derivation: {fn: expr, inputs: {aaa: yield.aaa3y, g: yield.gsec10y}, params: {expr: "(aaa - g) * 100"}, version: 1}}
- {key: ratio.gold_silver, name: "Gold/silver ratio", layer: derived, value_type: num, unit: x, frequency: monthly,
   derivation: {fn: expr, inputs: {gold: gold.inr10g, silver: silver.inrkg}, params: {expr: "gold * 100 / silver"}, version: 1}}
- {key: gap.earnings_yield, name: "Earnings-yield gap (Nifty 50 vs 10Y)", entity: l1.equity, layer: derived, value_type: num, unit: "%", frequency: monthly,
   derivation: {fn: expr, inputs: {pe: pe.nifty50, y: yield.gsec10y}, params: {expr: "100 / pe - y"}, version: 1}}
- {key: yield.real10y, name: "Real 10Y yield", entity: l1.debt, layer: derived, value_type: num, unit: "%", frequency: monthly,
   derivation: {fn: expr, inputs: {y: yield.gsec10y, cpi: cpi.yoy}, params: {expr: "y - cpi"}, version: 1}}
- {key: gold.real, name: "Real gold price (CPI-deflated)", entity: metals.gold, layer: derived, value_type: num, unit: index, frequency: monthly,
   derivation: {fn: expr, inputs: {gold: gold.inr10g, cpi: cpi.index}, params: {expr: "gold * 100 / cpi"}, version: 1}}
- {key: spread.us_india_fwdpe, name: "S&P 500 − Nifty 50 forward P/E", entity: equity.intl, layer: derived, value_type: num, unit: x, frequency: monthly,
   derivation: {fn: expr, inputs: {us: pe.sp500_fwd, india: pe.nifty50_fwd}, params: {expr: "us - india"}, version: 1}}
- {key: breadth.nifty100, name: "Nifty 100 revision breadth", entity: idx.nifty100, layer: derived, value_type: num, unit: ratio, frequency: monthly, validation: {min: 0, max: 1},
   derivation: {fn: expr, inputs: {up: breadth.nifty100.up, down: breadth.nifty100.down}, params: {expr: "up / (up + down)"}, version: 1}}
- {key: breadth.midcap150, name: "Midcap 150 revision breadth", entity: idx.midcap150, layer: derived, value_type: num, unit: ratio, frequency: monthly, validation: {min: 0, max: 1},
