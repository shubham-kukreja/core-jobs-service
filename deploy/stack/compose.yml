# The full stack on one machine: the "staging" environment while everything
# runs locally. Separate project, volumes and ports from the dev containers
# (docker-compose.yml), so tests never touch it.
#
# Secrets come from the environment via deploy/stack/stack.env (gitignored;
# copy stack.env.example). Nothing secret is written in this file.
# Start with `make stack-init` once, then `make stack-up`. See docs/operations.md.
name: core-stack

x-app: &app
  image: core-jobs-service:local
  build: {context: ../.., dockerfile: Dockerfile}
  env_file: stack.env
  environment: &app-env
    APP_ENV: development   # no TLS locally; a hosted staging uses APP_ENV=staging (see docs/operations.md)
    DATABASE_URL: postgres://core_app:${APP_DB_PASSWORD:?set in stack.env}@postgres:5432/core?sslmode=disable
    MIGRATION_DATABASE_URL: postgres://core_owner:${OWNER_DB_PASSWORD:?set in stack.env}@postgres:5432/core?sslmode=disable
    BLOB_ENDPOINT: s3:9000
    BLOB_BUCKET: core
    BLOB_USE_TLS: "false"
    BLOB_SSE: "false"
    METRICS_ADDR: 0.0.0.0:9090   # reachable inside the compose network only; not published
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    s3: {condition: service_healthy}

services:
  postgres:
    image: postgres:16.6-alpine
    shm_size: 512m   # parallel query and VACUUM workers need more than Docker's 64 MB default
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set in stack.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in stack.env}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01_runtime_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_owner -d core"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:3.97
    environment:
      S3_ACCESS_KEY: ${BLOB_ACCESS_KEY:?set in stack.env}
      S3_SECRET_KEY: ${BLOB_SECRET_KEY:?set in stack.env}
    # The identity file is written from the environment at start, so the keys
    # live only in stack.env.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"core","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["migrate", "up"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      HTTP_ADDR: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app", "probe", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/app", "probe", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9095:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in stack.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports: ["127.0.0.1:16686:16686"]   # UI; OTLP (4318) stays on the compose network
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
  promdata:
  grafanadata:
