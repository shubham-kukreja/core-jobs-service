name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: core_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: core
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U core_owner -d core"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://core_owner:ci_owner_password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: go build ./...
      - name: Lint, vulnerabilities, seeds, OpenAPI
        run: make lint
      - name: Generated code is current
        run: make sqlc-check
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
